name: Docker Web
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepare_only:
        description: Prepare release branch without expecting a production deploy (initial setup only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: proyectobd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build ProyectoBD.Web/ProyectoBD.Web.csproj -c Release
      - run: dotnet run --project Pruebas/Infraestructura/Infraestructura.csproj -c Release
      - run: python3 -m unittest discover -s Pruebas/Despliegue -v
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Require current main before publishing latest
        shell: bash
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: |
            josueg07/proyectobd-web:latest
            josueg07/proyectobd-web:${{ github.sha }}
  release:
    needs: publish
    # Keep disabled until production configuration and its first update are approved.
    if: vars.DOKPLOY_CD_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.prepare_only)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable source/image pair for Dokploy
        id: release
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: >-
          python3 deploy/scripts/publish-release.py
          --revision "$GITHUB_SHA"
          --image "josueg07/proyectobd-web@$IMAGE_DIGEST"
          --push
      - name: Verify the public release and HTTPS
        if: steps.release.outputs.released == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.prepare_only)
        run: python3 deploy/scripts/verify-public.py --base-url https://proyectobd.duckdns.org --revision "$GITHUB_SHA" --attempts 60
