apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proyectobd-web
  namespace: proyectobd
  annotations:
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    nginx.ingress.kubernetes.io/session-cookie-name: ProyectoBDRoute
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: proyectobd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proyectobd-web
                port: {number: 80}
