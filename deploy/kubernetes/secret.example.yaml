# Sólo ejemplo. deploy-k8s.ps1 crea los Secrets reales desde archivos ignorados.
apiVersion: v1
kind: Secret
metadata:
  name: sql-secret
  namespace: proyectobd
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: REEMPLAZAR_NO_APLICAR_ESTE_EJEMPLO
---
apiVersion: v1
kind: Secret
metadata:
  name: web-secret
  namespace: proyectobd
type: Opaque
stringData:
  PROYECTOBD_CONNECTION_STRING: REEMPLAZAR_CON_CADENA_SQLSERVER
  DATA_PROTECTION_CERTIFICATE_PASSWORD: REEMPLAZAR
