name: proyectobd-redes
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configure MSSQL_SA_PASSWORD}
    volumes:
      - sql-data:/var/opt/mssql
    networks: [datos]
    healthcheck:
      test: [CMD-SHELL, 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver: {condition: service_healthy}
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Configure MSSQL_SA_PASSWORD}
    volumes:
      - ./sql/Proyecto_BD_Final.sql:/init/Proyecto_BD_Final.sql:ro
      - ../scripts/init-sql.sh:/init/init-sql.sh:ro
    entrypoint: [bash, /init/init-sql.sh]
    networks: [datos]
    restart: "no"
  web:
    image: josueg07/proyectobd-web@sha256:65d2c046651d00e16b8059118b52c45a5bfb95cb274ba06c4d8e87c093fef95f
    depends_on:
      sql-init: {condition: service_completed_successfully}
    expose: ["8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_HTTPS_PORT: "443"
      PROYECTOBD_CONNECTION_STRING: 'Server=sqlserver,1433;Database=Proyecto_BD;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;'
      DATA_PROTECTION_KEYS_PATH: /var/dpkeys
      # Exact DNS-resolved proxy IPs are trusted, not the entire Docker subnet.
      # Separate Compose inputs from runtime names: an obsolete /32 in
      # Dokploy's TRUSTED_PROXY_NETWORKS must not override this DNS policy.
      TRUSTED_PROXY_HOSTS: ${DOKPLOY_PROXY_HOSTS:-dokploy-traefik}
      TRUSTED_PROXY_NETWORKS: ${DOKPLOY_PROXY_NETWORKS:-10.0.1.0/24}
    volumes:
      - dp-keys:/var/dpkeys
    networks: [datos, frente]
    restart: unless-stopped
volumes:
  sql-data:
  dp-keys:
networks:
  datos: {internal: true}
  frente:
